# Lokale Testumgebung: WordPress + WooCommerce mit eingebundenem Plugin.
# Start und Einrichtung: bin/setup  ·  WP-CLI: bin/wp <befehl>
name: novemberkind-produkte

x-wordpress-volumes: &wordpress-volumes
  - wordpress:/var/www/html
  - .:/var/www/html/wp-content/plugins/novemberkind-produkte:ro

x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DEBUG: 1
  # Aus der lokalen .env, siehe .env.example
  NOVEMBERKIND_PRODUKTE_ANTHROPIC_KEY: ${NOVEMBERKIND_PRODUKTE_ANTHROPIC_KEY:-}
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_DEBUG_LOG', true);
    define('WP_DEBUG_DISPLAY', false);
    define('SCRIPT_DEBUG', true);
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('NOVEMBERKIND_PRODUKTE_ANTHROPIC_KEY', getenv('NOVEMBERKIND_PRODUKTE_ANTHROPIC_KEY') ?: '');

services:
  db:
    image: mariadb:lts
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 20

  wordpress:
    # PHP-Version an den Hoster anpassen
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8888:80"
    environment: *wordpress-env
    volumes: *wordpress-volumes

  mailpit:
    # Fängt alle Mails der Testumgebung ab, Ansicht unter http://localhost:8025
    image: axllent/mailpit
    ports:
      - "8025:8025"

  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wordpress-env
      HOME: /tmp
    volumes: *wordpress-volumes
    profiles: [cli]

volumes:
  db:
  wordpress:

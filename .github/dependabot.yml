# Wöchentliche Aktualisierungen als gebündelte Pull Requests gegen develop; Sicherheitsupdates kommen sofort.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      plugin:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /tools
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      tools:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
